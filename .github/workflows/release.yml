name: Release

# Veröffentlicht eine neue Version, sobald auf main ein neuer oberster Abschnitt in CHANGELOG.md steht (Form
# «## 2026.12.02 (2. Dezember 2026)»), und stellt danach die Download-Seite mit version.json und der Produktdokumentation
# (dokumentation.html) auf GitHub Pages bereit. Ohne Abschnitt im Changelog gibt es keine Release. Vor der Veröffentlichung
# prüft der Lauf CHANGELOG.md (scripts/release-info.mjs), die Version in der Produktdokumentation
# (scripts/check-dokumentation.mjs) und die Tests. Die gebaute Datei liegt nur in der Release, nie im Repository.
# Ändern sich nur Produktdokumentation oder Download-Seite, baut der Lauf die Seite neu, ohne neue Release.
# Zusatzweg: Actions → «Release» → «Run workflow». Ohne Angabe gilt die Version zuoberst in CHANGELOG.md; eine Angabe wie
# 2026.12.02, 20261202 oder 2026-12-02 braucht ebenfalls einen Abschnitt im Changelog. Der Start von Hand wiederholt auch
# einen abgebrochenen Lauf: Besteht die Release schon, baut er nur die Download-Seite neu.
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - docs/sgk-navigator-dokumentation.html
      - site/**
      - scripts/build-site.mjs
  workflow_dispatch:
    inputs:
      version:
        description: 'Version JJJJ.MM.TT (leer = oberster Abschnitt in CHANGELOG.md); die Version braucht einen Abschnitt in CHANGELOG.md'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bauen, testen, Release erstellen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      OFFLINE: '1'
      SGK_CHROME: bundled
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Version bestimmen und prüfen
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-info.mjs
          v="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"; v="${v#v}"
          # Nachsicht bei der Eingabe: 20261202 oder 2026-12-02 = 2026.12.02
          if printf '%s' "$v" | grep -Eq '^[0-9]{8}(-[0-9]+)?$'; then v="${v:0:4}.${v:4:2}.${v:6}"; fi
          if printf '%s' "$v" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$'; then v="${v:0:4}.${v:5:2}.${v:8}"; fi
          if [ -z "$v" ]; then v="$(node scripts/release-info.mjs --version)"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$'; then
            echo "::error::Version «$v» entspricht nicht dem Schema JJJJ.MM.TT oder JJJJ.MM.TT-n (z. B. 2026.12.02)."; exit 1
          fi
          node scripts/release-info.mjs --has "$v" || { echo "::error::CHANGELOG.md hat keinen Abschnitt «## $v (Datum)». Ohne Abschnitt gibt es keine Release."; exit 1; }
          build=true
          if gh release view "v$v" >/dev/null 2>&1; then
            build=false
            echo "Die Release v$v besteht schon. Der Lauf baut nur die Download-Seite neu." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          { echo "version=$v"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
          echo "Version: $v, neue Release: $build"

      - name: Version in der Produktdokumentation prüfen
        if: steps.v.outputs.build == 'true'
        run: node scripts/check-dokumentation.mjs --version "${{ steps.v.outputs.version }}"

      - name: Abhängigkeiten installieren
        if: steps.v.outputs.build == 'true'
        run: npm ci

      - name: Einheitstests
        if: steps.v.outputs.build == 'true'
        run: npm run test:unit

      - name: SGK-Navigator.html bauen
        if: steps.v.outputs.build == 'true'
        run: node build.mjs --version "${{ steps.v.outputs.version }}" --out dist/SGK-Navigator.html

      - name: Kurzprüfung der Oberfläche (Start, Hinweis auf neue Versionen)
        if: steps.v.outputs.build == 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends poppler-utils
          npx playwright test -c test/app/playwright.config.mjs app.spec.mjs version.spec.mjs --grep-invert "@netz|@daten"

      - name: Release erstellen
        if: steps.v.outputs.build == 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          node scripts/build-site.mjs --version "$V" --file dist/SGK-Navigator.html --out dist/site-probe --release-notes dist/release-notes.md
          gh release create "v$V" dist/SGK-Navigator.html --target "$GITHUB_SHA" \
            --title "SGK-Navigator $V" --notes-file dist/release-notes.md --latest
          echo "SGK-Navigator $V veröffentlicht: Release \`v$V\`." >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Download-Seite veröffentlichen
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Download-Seite für die veröffentlichte Version bauen
        run: |
          gh release download "v$V" --pattern SGK-Navigator.html --dir dist
          node scripts/build-site.mjs --version "$V" --file dist/SGK-Navigator.html --out dist/site

      - name: Download-Seite für GitHub Pages bereitstellen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
