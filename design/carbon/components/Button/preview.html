<!-- @dsCard group="Aktionen" height=200 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>body{margin:0;background:var(--canvas)}</style>
</head>
<body>
<div class="ui-root" style="padding: 24px; background: var(--canvas)">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<button type="button" class="ui-btn ui-btn--primary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h6a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H4z"></path><path d="M20 5.5h-6a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2h6z"></path></svg>Text lesen</button>
<button type="button" class="ui-btn ui-btn--secondary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4.5V8h3.5"></path><path d="M12 8v4l3 2"></path></svg>Chronologie öffnen</button>
<button type="button" class="ui-btn ui-btn--tertiary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10.5l5 5 5-5"></path><path d="M5 20h14"></path></svg>Karte exportieren</button>
<button type="button" class="ui-btn ui-btn--ghost"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 9.5a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.6"></path><path d="M12 17h.01"></path></svg>Anleitung</button>
<button type="button" class="ui-btn ui-btn--danger">Dossier löschen</button>
<button type="button" class="ui-btn ui-btn--primary" disabled>Rückgängig</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<span class="ui-btn-group"><button type="button" class="ui-btn ui-btn--secondary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15"></rect><path d="M12 4.5v15"></path></svg>Vergleichen</button><button type="button" class="ui-btn ui-btn--primary"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4.5V8h3.5"></path><path d="M12 8v4l3 2"></path></svg>Chronologie</button></span>
<button type="button" class="ui-btn ui-btn--secondary ui-btn--sm"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>Filter</button>
<button type="button" class="ui-btn ui-btn--tertiary ui-btn--icon" aria-label="Stände tauschen"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h13"></path><path d="M15 5l3 3-3 3"></path><path d="M19 16H6"></path><path d="M9 13l-3 3 3 3"></path></svg></button>
<button type="button" class="ui-btn ui-btn--ghost ui-btn--icon" aria-label="Hilfe zu dieser Ansicht"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 9.5a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2-2.4 3.6"></path><path d="M12 17h.01"></path></svg></button>
<a class="ui-link" href="#">Methodik und Haftung</a>
</div>
</div>
</div>
<script>
document.querySelectorAll('.ui-seg').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
});
document.querySelectorAll('[role="tablist"]').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('[role="tab"]'); if (!b) return;
    g.querySelectorAll('[role="tab"]').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
  });
});
document.querySelectorAll('.ui-stagebar').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('.ui-stage'); if (!b) return;
    g.querySelectorAll('.ui-stage').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
});
</script>
</body>
</html>
