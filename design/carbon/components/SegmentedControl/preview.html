<!-- @dsCard group="Aktionen" height=150 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>body{margin:0;background:var(--canvas)}</style>
</head>
<body>
<div class="ui-root" style="padding: 24px; background: var(--canvas)">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end">
<div class="ui-field"><span class="ui-label">Sicht</span><div class="ui-seg" role="group" aria-label="Sicht"><button type="button" aria-pressed="true">Stand wählen</button><button type="button" aria-pressed="false">Anwendbar am …</button><button type="button" aria-pressed="false">Alle beschlossenen Änderungen</button></div></div>
<div class="ui-field"><span class="ui-label">Rechtstext</span><div class="ui-seg" role="group" aria-label="Rechtstext"><button type="button" aria-pressed="true">DE</button><button type="button" aria-pressed="false">FR</button><button type="button" aria-pressed="false">EN</button></div></div>
<div class="ui-field"><span class="ui-label">Darstellung</span><div class="ui-seg ui-seg--sm" role="group" aria-label="Darstellung"><button type="button" aria-pressed="true">Nebeneinander</button><button type="button" aria-pressed="false">Redline</button></div></div>
</div>
</div>
<script>
document.querySelectorAll('.ui-seg').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
});
document.querySelectorAll('[role="tablist"]').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('[role="tab"]'); if (!b) return;
    g.querySelectorAll('[role="tab"]').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
  });
});
document.querySelectorAll('.ui-stagebar').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('.ui-stage'); if (!b) return;
    g.querySelectorAll('.ui-stage').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
});
</script>
</body>
</html>
