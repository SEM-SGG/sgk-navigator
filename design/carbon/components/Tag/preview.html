<!-- @dsCard group="Status" height=200 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>body{margin:0;background:var(--canvas)}</style>
</head>
<body>
<div class="ui-root" style="padding: 24px; background: var(--canvas)">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="ui-tag ui-tag--success">anwendbar seit 7. April 2017</span><span class="ui-tag ui-tag--pending">beschlossen, noch nicht anwendbar</span><span class="ui-tag">Vorschlag, im Trilog</span><span class="ui-tag ui-tag--info">konsolidiert, ergänzt</span><span class="ui-tag ui-tag--outline">rekonstruiert</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="ui-tag ui-tag--pending">Beispiel</span><span class="ui-tag ui-tag--error"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>LIMITE</span><span class="ui-tag ui-tag--ins">eingefügt</span><span class="ui-tag ui-tag--info">ersetzt</span><span class="ui-tag ui-tag--del">gestrichen</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="ui-tag ui-tag--support">Unterstützung</span><span class="ui-tag ui-tag--with-changes">Unterstützung mit Änderungen</span><span class="ui-tag ui-tag--scrutiny">Prüfvorbehalt</span><span class="ui-tag ui-tag--reservation">Vorbehalt</span><span class="ui-tag ui-tag--oppose">Ablehnung</span><span class="ui-tag ui-tag--none">keine Position</span><span class="ui-tag ui-tag--outline">Priorität hoch</span></div>
</div>
</div>
<script>
document.querySelectorAll('.ui-seg').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
});
document.querySelectorAll('[role="tablist"]').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('[role="tab"]'); if (!b) return;
    g.querySelectorAll('[role="tab"]').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
  });
});
document.querySelectorAll('.ui-stagebar').forEach(function (g) {
  g.addEventListener('click', function (e) {
    var b = e.target.closest('.ui-stage'); if (!b) return;
    g.querySelectorAll('.ui-stage').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
});
</script>
</body>
</html>
